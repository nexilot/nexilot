<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXILOT - Hádaj Okná</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-gap: 10px;
            justify-content: center;
            margin: 20px;
        }

        .cell {
            width: 80px;
            height: 80px;
            font-size: 30px;
            text-align: center;
            line-height: 80px;
            background-color: #1e1e1e;
            border: 2px solid #ffffff;
            border-radius: 10px;
            cursor: pointer;
        }

        .cell.revealed {
            pointer-events: none;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #6200ea;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            margin: 10px;
        }

        button:disabled {
            background-color: #333;
            cursor: not-allowed;
        }

        #result, #balance, #multiplier {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        input {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 5px;
            width: 60px;
        }
    </style>
</head>
<body>
    <h1>💣 NEXILOT - Hádaj Okná 💣</h1>
    <p>Vyber bezpečné políčka a vyhraj mince!</p>

    <div>
        <label>Stávka: <input type="number" id="bet" min="10" value="10"></label>
    </div>
    <div>
        <label>Počet bômb: <input type="number" id="bombCount" min="1" max="10" value="5"></label>
    </div>

    <p>💰 Tvoje mince: <span id="balance">100</span></p>
    <p>🔢 Násobok výhry: <span id="multiplier">1×</span></p>

    <div class="grid" id="grid"></div>

    <button id="cashoutButton" disabled>Vybrať výhru</button>
    <button id="restartButton">Nová hra</button>
    <p id="result"></p>

    <script>
        let balance = 100;
        let bet = 10;
        let safeClicks = 0;
        let bombs = [];
        let cells = [];
        let cashoutMultiplier = 1;
        let bombCount = 5;
        const grid = document.getElementById("grid");
        const resultText = document.getElementById("result");
        const balanceText = document.getElementById("balance");
        const multiplierText = document.getElementById("multiplier");
        const betInput = document.getElementById("bet");
        const bombInput = document.getElementById("bombCount");
        const restartButton = document.getElementById("restartButton");
        const cashoutButton = document.getElementById("cashoutButton");

        function startGame() {
            bet = parseInt(betInput.value);
            bombCount = parseInt(bombInput.value);

            if (bet < 10) {
                resultText.textContent = "Minimálna stávka je 10 mincí!";
                return;
            }

            if (bet > balance) {
                resultText.textContent = "Nemáš dostatok mincí!";
                return;
            }

            balance -= bet;
            balanceText.textContent = balance;
            resultText.textContent = "🧐 Vyber bezpečné okienka!";
            safeClicks = 0;
            cashoutMultiplier = 1;
            multiplierText.textContent = "1×";
            cashoutButton.disabled = true;
            grid.innerHTML = "";

            // Generovanie bômb
            bombs = Array(16).fill(false);
            let placedBombs = 0;
            while (placedBombs < bombCount) {
                let index = Math.floor(Math.random() * 16);
                if (!bombs[index]) {
                    bombs[index] = true;
                    placedBombs++;
                }
            }

            // Vytvorenie hracej plochy
            for (let i = 0; i < 16; i++) {
                let cell = document.createElement("div");
                cell.classList.add("cell");
                cell.dataset.index = i;
                cell.addEventListener("click", () => revealCell(i));
                grid.appendChild(cell);
                cells[i] = cell;
            }

            restartButton.disabled = true;
        }

        function revealCell(index) {
            if (bombs[index]) {
                // Prehral si
                cells[index].textContent = "💥";
                cells[index].style.backgroundColor = "red";
                revealAll();
                resultText.textContent = "😢 Prehral si!";
                restartButton.disabled = false;
                cashoutButton.disabled = true;
                return;
            }

            // Správne políčko
            cells[index].textContent = "✅";
            cells[index].style.backgroundColor = "green";
            cells[index].classList.add("revealed");
            safeClicks++;

            // Zvýšenie násobku podľa počtu bômb
            cashoutMultiplier = getMultiplier(safeClicks, bombCount);
            multiplierText.textContent = `${cashoutMultiplier}×`;

            // Povolenie vybratia výhry
            if (safeClicks >= 2) {
                cashoutButton.disabled = false;
            }

            // Výhra pri 7 bezpečných políčkach
            if (safeClicks >= 7) {
                cashout();
            }
        }

        function cashout() {
            let winnings = bet * cashoutMultiplier;
            balance += winnings;
            balanceText.textContent = balance;
            resultText.textContent = `🎉 Vybral si ${winnings} mincí!`;
            revealAll();
            restartButton.disabled = false;
            cashoutButton.disabled = true;
        }

        function revealAll() {
            cells.forEach((cell, i) => {
                if (bombs[i]) cell.textContent = "💣";
                cell.classList.add("revealed");
            });
        }

        function getMultiplier(safeClicks, bombCount) {
            const baseMultipliers = {1: 1.2, 2: 1.5, 3: 2, 4: 2.5, 5: 3, 6: 3.5, 7: 4};
            let multiplier = baseMultipliers[safeClicks] || 1;
            return (multiplier + (bombCount * 0.1)).toFixed(2);
        }

        restartButton.addEventListener("click", startGame);
        cashoutButton.addEventListener("click", cashout);
        bombInput.addEventListener("change", startGame);

        startGame();
    </script>
</body>
</html>
