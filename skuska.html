<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXILOT - Hádaj Okná</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-gap: 10px;
            justify-content: center;
            margin: 20px;
        }

        .cell {
            width: 80px;
            height: 80px;
            font-size: 30px;
            text-align: center;
            line-height: 80px;
            background-color: #1e1e1e;
            border: 2px solid #ffffff;
            border-radius: 10px;
            cursor: pointer;
        }

        .cell.revealed {
            pointer-events: none;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #6200ea;
            color: #ffffff;
            border: none;
            border-radius: 5px;
        }

        button:disabled {
            background-color: #333;
            cursor: not-allowed;
        }

        #result, #balance {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        input {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 5px;
            width: 60px;
        }
    </style>
</head>
<body>
    <h1>💣 NEXILOT - Hádaj Okná 💣</h1>
    <p>Vyber bezpečné políčka a vyhraj mince!</p>

    <div>
        <label>Stávka: <input type="number" id="bet" min="10" value="10"></label>
    </div>

    <p>💰 Tvoje mince: <span id="balance">100</span></p>

    <div class="grid" id="grid"></div>

    <button id="restartButton">Nová hra</button>
    <p id="result"></p>

    <script>
        let balance = 100;
        let bet = 10;
        let safeClicks = 0;
        let bombs = [];
        let cells = [];
        const grid = document.getElementById("grid");
        const resultText = document.getElementById("result");
        const balanceText = document.getElementById("balance");
        const betInput = document.getElementById("bet");
        const restartButton = document.getElementById("restartButton");

        function startGame() {
            bet = parseInt(betInput.value);
            if (bet < 10) {
                resultText.textContent = "Minimálna stávka je 10 mincí!";
                return;
            }

            if (bet > balance) {
                resultText.textContent = "Nemáš dostatok mincí!";
                return;
            }

            balance -= bet;
            balanceText.textContent = balance;
            resultText.textContent = "🧐 Vyber bezpečné okienka!";
            safeClicks = 0;
            grid.innerHTML = "";

            // Generovanie bômb
            bombs = Array(12).fill(false);
            let bombCount = 3;
            while (bombCount > 0) {
                let index = Math.floor(Math.random() * 12);
                if (!bombs[index]) {
                    bombs[index] = true;
                    bombCount--;
                }
            }

            // Vytvorenie hracej plochy
            for (let i = 0; i < 12; i++) {
                let cell = document.createElement("div");
                cell.classList.add("cell");
                cell.dataset.index = i;
                cell.addEventListener("click", () => revealCell(i));
                grid.appendChild(cell);
                cells[i] = cell;
            }

            restartButton.disabled = true;
        }

        function revealCell(index) {
            if (bombs[index]) {
                cells[index].textContent = "💥";
                cells[index].style.backgroundColor = "red";
                cells.forEach((cell, i) => {
                    if (bombs[i]) cell.textContent = "💣";
                    cell.classList.add("revealed");
                });
                resultText.textContent = "😢 Prehral si!";
                restartButton.disabled = false;
                return;
            }

            cells[index].textContent = "✅";
            cells[index].style.backgroundColor = "green";
            cells[index].classList.add("revealed");
            safeClicks++;

            if (safeClicks >= 5) {
                let winnings = bet * 2;
                balance += winnings;
                balanceText.textContent = balance;
                resultText.textContent = `🎉 Vyhral si ${winnings} mincí!`;
                cells.forEach(cell => cell.classList.add("revealed"));
                restartButton.disabled = false;
            }
        }

        restartButton.addEventListener("click", startGame);

        startGame();
    </script>
</body>
</html>
