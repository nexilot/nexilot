<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXILOT Hra</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }

        .slot-machine {
            display: flex;
            justify-content: center;
            margin: 20px;
        }

        .slot {
            width: 80px;
            height: 80px;
            margin: 10px;
            font-size: 50px;
            text-align: center;
            line-height: 80px;
            background-color: #1e1e1e;
            border: 2px solid #ffffff;
            border-radius: 10px;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #6200ea;
            color: #ffffff;
            border: none;
            border-radius: 5px;
        }

        button:disabled {
            background-color: #333;
            cursor: not-allowed;
        }

        #result, #balance {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        input {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 5px;
            width: 60px;
        }
    </style>
</head>
<body>
    <h1>🎰 NEXILOT Hra 🎰</h1>
    <p>Minimálna stávka: 10 mincí</p>
    <p>Vyhraj trojicu a znásob svoju výhru!</p>

    <div>
        <label>Stávka: <input type="number" id="bet" min="10" value="10"></label>
    </div>

    <p>💰 Tvoje mince: <span id="balance">100</span></p>

    <div class="slot-machine">
        <div class="slot" id="slot1">❓</div>
        <div class="slot" id="slot2">❓</div>
        <div class="slot" id="slot3">❓</div>
    </div>
    
    <button id="spinButton">Točiť!</button>
    <p id="result"></p>

    <script>
        let balance = 100;
        const symbols = ["🍒", "🍋", "🍉", "⭐", "🍇"];
        const slot1 = document.getElementById("slot1");
        const slot2 = document.getElementById("slot2");
        const slot3 = document.getElementById("slot3");
        const spinButton = document.getElementById("spinButton");
        const resultText = document.getElementById("result");
        const balanceText = document.getElementById("balance");
        const betInput = document.getElementById("bet");

        spinButton.addEventListener("click", () => {
            let bet = parseInt(betInput.value);
            if (bet < 10) {
                resultText.textContent = "Minimálna stávka je 10 mincí!";
                return;
            }

            if (bet > balance) {
                resultText.textContent = "Nemáš dostatok mincí!";
                return;
            }

            let multiplier = getMultiplier(bet);
            balance -= bet;
            balanceText.textContent = balance;
            resultText.textContent = "⏳ Točenie začne o 1 sekundu...";
            spinButton.disabled = true;

            setTimeout(() => {
                resultText.textContent = "Točí sa...";
                let spins = 10;
                let interval = setInterval(() => {
                    slot1.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                    slot2.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                    slot3.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                    spins--;

                    if (spins === 0) {
                        clearInterval(interval);
                        checkWin(bet, multiplier);

                        // Cooldown 1,5 sekundy po skončení
                        setTimeout(() => {
                            spinButton.disabled = false;
                        }, 1500);
                    }
                }, 100);
            }, 1000);
        });

        function checkWin(bet, multiplier) {
            if (slot1.textContent === slot2.textContent && slot2.textContent === slot3.textContent) {
                let winnings = bet * multiplier;
                balance += winnings;
                resultText.textContent = `🎉 Vyhral si ${winnings} mincí! (Násobok ${multiplier}×)`;
            } else {
                resultText.textContent = "😢 Skús znova!";
            }
            balanceText.textContent = balance;
        }

        function getMultiplier(bet) {
            if (bet >= 100) return 5;
            if (bet >= 50) return 3;
            return 2;
        }
    </script>
</body>
</html>
